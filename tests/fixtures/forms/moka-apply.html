<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Moka模拟报名表</title></head>
<body>
<input id="moka-version" value="1">
<input placeholder="输入职位关键字">
<section>
  <h2>个人信息</h2>
  <div class="ant-form-item"><label class="ant-form-item-label">姓名</label><input id="moka-name" placeholder="姓名"></div>
  <div class="ant-form-item"><label class="ant-form-item-label">手机号码</label><input id="moka-phone" placeholder="请输入手机号"></div>
  <div class="ant-form-item"><label class="ant-form-item-label">邮箱</label><input id="moka-email" placeholder="邮箱"></div>
  <div class="ant-form-item">
    <label class="ant-form-item-label">学历</label>
    <div class="ant-select">
      <input id="moka-degree" placeholder="请选择" readonly>
      <div class="ant-select-dropdown">
        <div class="ant-select-item" role="option">本科</div>
        <div class="ant-select-item" role="option">硕士</div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
