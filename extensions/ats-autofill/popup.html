<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Career OS 网申自动填表助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 16px;
      font-size: 13px;
    }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .title { font-size: 15px; font-weight: 700; color: #4f46e5; }
    .version { font-size: 11px; background: #e0e7ff; color: #4338ca; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; gap: 8px; }
    .info-row:last-child { margin-bottom: 0; }
    .label { color: #64748b; flex-shrink: 0; }
    .val { font-weight: 600; color: #1e293b; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-fill {
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .tip { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 10px; line-height: 1.4; }
    .err { color: #b91c1c; font-size: 12px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Career OS 填表</div>
    <div class="version">v1.3 项目目录</div>
  </div>
  <div class="err" id="disp-error" hidden></div>
  <div class="card">
    <div class="info-row"><span class="label">候选人</span><span class="val" id="disp-name">—</span></div>
    <div class="info-row"><span class="label">院校</span><span class="val" id="disp-school">—</span></div>
    <div class="info-row"><span class="label">求职意向</span><span class="val" id="disp-target">—</span></div>
    <div class="info-row"><span class="label">已捕获岗位</span><span class="val" id="disp-job">尚未捕获</span></div>
    <div class="info-row"><span class="label">保存位置</span><span class="val" id="disp-save">未绑定</span></div>
  </div>
  <button class="btn-fill" id="btn-bind-dir" style="background:#312e81;margin-bottom:8px;">绑定项目目录 captures</button>
  <button class="btn-fill" id="btn-popup-capture" style="background:#4338ca;margin-bottom:8px;">捕获当前岗位 JD + 表单</button>
  <button class="btn-fill" id="btn-popup-fill">一键填充当前页面表单</button>
  <div class="tip">
    捕获写入项目 <code>data\job_discovery\captures</code>，不再进 EdgeDownloads。<br>
    若失败：扩展重新加载，或点「绑定」选该文件夹。
  </div>
  <script src="dir-store.js"></script>
  <script src="popup.js"></script>
</body>
</html>
