<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Career OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 260px;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 12px;
      font-size: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .title { font-size: 14px; font-weight: 700; color: #4f46e5; }
    .gear {
      width: 36px; height: 36px; border: none; border-radius: 10px;
      background: #4f46e5; color: #fff; font-size: 18px; cursor: pointer;
    }
    .gear:hover { background: #4338ca; }
    .hint { color: #64748b; margin: 8px 0 10px; line-height: 1.4; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 4px 0; vertical-align: middle; }
    td.k { color: #4338ca; font-weight: 700; font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
    td.l { color: #334155; text-align: right; }
    .foot { margin-top: 10px; color: #94a3b8; font-size: 11px; }
  </style>
</head>
<body>
  <div class="row">
    <div class="title">Career OS 填表</div>
    <button class="gear" id="btn-gear" title="打开详细设置">⚙</button>
  </div>
  <p class="hint">只装插件即可。点齿轮填底稿并启用；网申页点格子即可在旁边填/复制。</p>
  <table id="shortcut-table"></table>
  <p class="foot">默认 Alt+Shift+字母，可在设置页改。</p>
  <script src="shortcuts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
