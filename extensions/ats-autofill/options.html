<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Career OS 填表设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
<div class="page">
<div class="shell">
  <header class="top">
    <div>
      <h1>填表内容库</h1>
      <p class="sub">一份自由模块底稿，字段名可以改。换站请手动点「自适应配置」或「用本页上次配置」，不会按网址自动切。</p>
    </div>
    <label class="switch-wrap">
      <span id="switch-label">关闭 · 读本地 JSON</span>
      <input type="checkbox" id="overlay-enabled">
      <span class="switch"></span>
    </label>
  </header>

  <div class="toolbar">
    <button type="button" class="btn primary" id="btn-import">一键导入并启用</button>
    <button type="button" class="btn" id="btn-from-json">从本地 JSON 填入</button>
    <button type="button" class="btn" id="btn-from-page">从当前网申页自适应</button>
    <button type="button" class="btn" id="btn-apply-shape">用本页上次配置</button>
    <button type="button" class="btn danger" id="btn-clear">清空本页</button>
  </div>
  <div class="msg" id="msg" hidden></div>

  <div class="dropzone" id="sec-import">
    <input type="file" id="file-json" accept="application/json,.json" hidden>
    <strong>把 JSON 拖到这里导入</strong>
    <span>按模块名/字段名灌进内容库。旧 universal 画像会一次性迁入。不要求固定槽位。</span>
    <div class="drop-actions">
      <button type="button" class="btn" id="btn-pick-json">选择 JSON 文件</button>
      <button type="button" class="btn primary" id="btn-copy-prompt">一键复制 AI 提示词</button>
    </div>
  </div>

  <section class="shortcuts" id="sec-keys">
    <h2>快捷键（网申页生效）</h2>
    <p class="sub" style="margin-bottom:10px;">点输入框后按下组合键录制。填入/复制都针对<strong>当前格子</strong>，不用滚到右下角。</p>
    <div id="shortcut-editor"></div>
    <button type="button" class="btn" id="btn-shortcut-reset">恢复默认快捷键</button>
  </section>

  <section id="sec-fill-policy">
    <h2>一键填充范围</h2>
    <p class="sub">按内容库模块标题勾选。只影响「一键填充 / 仅填空白」；格子旁「填入」仍可逐项手填。</p>
    <div class="fill-policy-actions">
      <button type="button" class="btn" id="btn-fill-all">全选</button>
      <button type="button" class="btn" id="btn-fill-none">全不选</button>
    </div>
    <div class="fill-policy-grid" id="fill-policy-grid"></div>
  </section>

  <form id="overlay-form">
    <div id="notebook-root"></div>
    <div class="toolbar">
      <button type="button" class="btn" id="btn-add-module">添加模块</button>
    </div>
  </form>

  <p class="foot">不自动点网申提交。开关打开时用本页内容库；关闭时走 Career OS 本地 JSON / 专投海投。换站不会自动改骨架。</p>
</div>
<nav class="toc" id="toc" aria-label="填写导航">
  <div class="toc-title">填写导航</div>
  <div id="toc-links"></div>
</nav>
</div>
  <script src="overlay-store.js"></script>
  <script src="fill-policy.js"></script>
  <script src="shortcuts.js"></script>
  <script src="options.js"></script>
</body>
</html>
