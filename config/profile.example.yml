# Career OS — 个人求职画像(脱敏样本模板)
# 所有 Skill 运行时读取此文件作为上下文。
#
# 使用方式:
#   1. 复制本文件:cp config/profile.example.yml config/profile.yml
#   2. 用你的真实信息替换 {{占位符}}
#   3. profile.yml 已在 .gitignore 中,不会进版本库(保护隐私)
#
# 隐私说明:真实 profile.yml 含个人身份信息,不应推送到公开仓库。
#
# 与个人数据仓库:
#   仓库经 MCP 给 LLM 供数；用 skill career-personal-data-update 刷新
#   skills/projects/evidence_summary 等。身份字段勿被仓库盲写。
#   说明: docs/personal-data-warehouse.md

personal:
  name: "{{你的姓名}}"
  birth_year: {{出生年}}
  age: {{年龄}}

education:
  current: "{{在读状态,如:专升本在读}}"
  school: "{{学校全称}}"
  major: "{{专业}}"
  graduation: "{{毕业年月,如:2027-06}}"
  degree: "{{学历,如:本科}}"

career_target:
  primary:
    - "{{主攻方向 1,如:运维/技术支持}}"
    - "{{主攻方向 2,如:IoT 平台运维}}"
  secondary:
    - "{{备选方向 1,如:AI Agent 部署运维}}"
    - "{{备选方向 2}}"
  dream:
    - "{{理想方向 1,如:外企技术支持}}"
  cities:
    - "{{目标城市 1}}"
    - "{{目标城市 2}}"

skills:
  proficient:    # 熟练:能独立完成 + 能教别人 + 能排查问题
    - "{{技能 1}}"
    - "{{技能 2}}"
  familiar:      # 掌握:看得懂 + 能改 + 知道在哪查
    - "{{技能 3}}"
  learning:      # 学习中:知道是什么 + 在学 + 还没独立用过
    - "{{技能 4}}"

projects:
  - name: "{{项目名}}"
    year: {{年份}}
    highlight: "{{一句话亮点,含量化结果}}"
  - name: "{{项目名}}"
    description: "{{项目描述}}"

current_stage: "{{当前阶段,如:秋招准备}}"
target_timeline:
  now: "{{近期计划}}"
  summer: "{{暑期计划}}"
  autumn: "{{秋季计划}}"

constraints:
  - "{{个人约束 1}}"
  - "{{薪资预期}}"

english_level: "{{当前英语水平}}"
english_target: "{{英语目标}}"
