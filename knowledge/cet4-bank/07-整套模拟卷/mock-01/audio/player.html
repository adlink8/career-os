<script>
const CUES=[{"start": 0.0, "end": 2.304, "en": "News Report One.", "zh": "新闻报道一。", "role": "meta", "tip": "新闻一（高温应急）Q1–Q2：首句导语就是 Q1 答案（开放九处避暑场所），末句市长十一月提案是 Q2；中间 41℃、22 人送医、4000 棵树只当定位锚，buses / pools / hospitals 这些原词全是错项诱饵。"}, {"start": 3.104, "end": 16.904, "en": "The hottest day of September on record pushed the city of Tucson to activate its emergency heat plan for the first time this year, opening nine cooling centers in libraries, community colleges and fire stations.", "zh": "有记录以来最热的一个九月天，让图森（Tucson）市今年首次启动高温应急计划，在图书馆、社区学院和消防站开放了九个降温避暑点。", "role": "n", "marks": [{"p": 131, "l": 79, "t": "answer", "note": "Q1→B：导语即答案，开放九处避暑场所（图书馆／社区学院／消防站）＝选项 “made public buildings available as refuges”"}]}, {"start": 17.204, "end": 28.244, "en": "The National Weather Service logged 41 degrees Celsius downtown shortly before three in the afternoon, one degree above the previous mark from 2006.", "zh": "美国国家气象局（National Weather Service）记录到，下午三点前不久市区气温高达41摄氏度，比2006年的旧纪录还高出一度。", "role": "n", "marks": [{"p": 36, "l": 18, "t": "detail", "note": "Q1：题干 record heat 的具体数字，听到即确认首句事件成立（本句其余 2006／one degree 不出题）"}]}, {"start": 28.544, "end": 38.888, "en": "Officials urged residents to ride free municipal buses between errands rather than walk, and public pools stayed open two hours longer than usual.", "zh": "官方敦促市民出门办事时改乘免费市政公交车、不要步行，公共泳池也比平时延长开放两小时。", "role": "n", "marks": [{"p": 29, "l": 25, "t": "trap", "note": "与 Q1 错项 C “suspended bus service until the evening” 同词 bus，原文是免费乘坐而非停驶，勿秒选"}, {"p": 106, "l": 28, "t": "trap", "note": "与 Q1 错项 D “asked shops to stay open through the night” 同词 stay open，原文主语是 public pools，勿秒选"}]}, {"start": 39.188, "end": 47.036, "en": "Utilities warned that pressure on the electrical grid would remain tight until evening, when air-conditioner use peaks.", "zh": "电力公司警告说，电网压力将持续紧张，直到傍晚空调使用高峰到来。", "role": "n", "marks": [{"p": 73, "l": 13, "t": "trap", "note": "与 Q1 错项 C “…until the evening” 逐字同词；Q2 错项 B 的 electricity 也出自本句 electrical grid，均勿秒选"}]}, {"start": 47.336, "end": 54.392, "en": "City hospitals reported twenty-two heat-related admissions, most of them over the age of seventy.", "zh": "市立医院报告了22例与高温相关的入院病例，其中大多数患者超过七十岁。", "role": "n", "marks": [{"p": 0, "l": 23, "t": "trap", "note": "与 Q1 错项 A “closed hospitals”、Q2 错项 C “the main hospital” 同词 hospital，原文只报收治人数，未关医院也未设新病房，勿秒选"}]}, {"start": 54.692, "end": 66.068, "en": "The mayor said shaded bus stops and four thousand additional street trees would go before the council in November, together with money to insulate the homes of low-income families.", "zh": "市长表示，带遮阳设施的公交站和加种四千棵行道树的提案将于11月提交市议会，其中还包括为低收入家庭住宅加装隔热层的资金。", "role": "n", "marks": [{"p": 15, "l": 58, "t": "answer", "note": "Q2→A：林荫站台＋增植行道树＝选项 “streets” 的长期改造"}, {"p": 102, "l": 11, "t": "detail", "note": "Q2：题干时间词，听到 in November 即知进入末句提案句"}, {"p": 129, "l": 50, "t": "answer", "note": "Q2→A：为低收入住户房屋保温＝选项 “housing” 的长期改造；D “泳池延长开放” 是第三句已实施的细节，非本句"}]}, {"start": 66.368, "end": 71.868, "en": "", "zh": "⏳ 请作答（5 秒）", "role": "gap"}, {"start": 71.868, "end": 74.268, "en": "News Report Two.", "zh": "新闻报道二。", "role": "meta", "tip": "新闻二（博物馆数字化）Q3–Q4：答案在前两句（完整在线目录＋四年拍完全部藏品）和倒数第二句（校群到访增两成）；‘只展九百件’‘借用设备’‘周日免费’三处原词分别对应 A、D、B 错项。"}, {"start": 75.068, "end": 84.572, "en": "A regional museum that had kept almost all of its collection in boxes has reopened with a complete online catalogue and free handheld guides.", "zh": "一家地方博物馆曾把几乎全部馆藏都装在箱子里，如今重新开放，并推出了完整的在线馆藏目录和免费手持导览设备。", "role": "n", "marks": [{"p": 27, "l": 42, "t": "trap", "note": "与 Q3 错项 A “hung its whole collection in new galleries”、C “emptied its storage rooms” 同词 collection／库房意象，原文说藏品大多仍在箱中，勿秒选"}, {"p": 88, "l": 27, "t": "answer", "note": "Q3→D：完整在线目录＝选项 “built a digital record of what it owns”"}]}, {"start": 84.872, "end": 98.816, "en": "The Riverside Institute spent four point two million dollars over four years photographing each of its thirty-eight thousand objects; the images are now downloadable, and teachers have been using them to build classroom lessons.", "zh": "河畔研究所（Riverside Institute）花四年时间、四千二百万美元，为三万八千件藏品逐一拍照存档；这些图片现在都可以下载，老师们一直在用它们来设计课堂教学。", "role": "n", "marks": [{"p": 61, "l": 71, "t": "answer", "note": "Q3→D：四年为全部三万八千件藏品建影像＝数字记录的建成过程（题干 over the past four years 就定位到这里）"}, {"p": 134, "l": 31, "t": "answer", "note": "Q3→D 关键：影像现可下载＝record 已建成；同词的 photographing 是错项 B “sold photographs…to schools” 的诱饵，原文并未出售"}]}, {"start": 99.116, "end": 106.892, "en": "Only about nine hundred pieces hang in the galleries, though curators promise to rotate the displays twice a year.", "zh": "展厅里实际展出的只有大约九百件，不过策展人承诺每年更换两次展品。", "role": "n", "marks": [{"p": 0, "l": 52, "t": "trap", "note": "与 Q3 错项 A “hung its whole collection in new galleries” 同词 hang…in the galleries，Only about nine hundred 恰恰相反，勿秒选"}, {"p": 54, "l": 6, "t": "signal", "note": "Q3：though 后是轮换展出的补充信息，判断 A 对错靠的是主句的 Only"}]}, {"start": 107.192, "end": 116.912, "en": "Visitors may bring their own telephones or take a device from the front desk to summon pictures, recordings and descriptions in six languages.", "zh": "参观者可以自带手机，也可以从服务台领一台设备，调看图样、录音和六种语言的讲解。", "role": "n", "marks": [{"p": 43, "l": 33, "t": "trap", "note": "与 Q4 错项 D “Visitors were required to carry a device” 同词 device，原文是可自愿借用而非强制，勿秒选"}]}, {"start": 117.212, "end": 130.94, "en": "The director said the goal was to reach people who rarely walk through museum doors: downloads from other countries now make up about a third of the traffic, and school groups arrived twenty percent more often during the first term.", "zh": "馆长说，目标是触达那些很少踏进博物馆大门的人：目前来自国外的下载量约占总访问量的三分之一，第一学期学校团体到访的频率提高了百分之二十。", "role": "n", "marks": [{"p": 85, "l": 71, "t": "trap", "note": "与 Q4 错项 A “Visitors from other countries replaced local ones” 同词 from other countries，原文只说占约三分之一流量，未谈取代，勿秒选"}, {"p": 162, "l": 69, "t": "answer", "note": "Q4→C：首学期到校团体增两成＝选项 “More classes arrived with their teachers”"}]}, {"start": 131.24, "end": 134.792, "en": "Admission stays free on Sundays.", "zh": "周日免费入场。", "role": "n", "marks": [{"p": 0, "l": 31, "t": "trap", "note": "与 Q4 错项 B “Free Sunday tickets doubled in a month” 同词 free…Sundays，这是既有政策、无翻倍一事，勿秒选"}]}, {"start": 135.092, "end": 140.592, "en": "", "zh": "⏳ 请作答（5 秒）", "role": "gap"}, {"start": 140.592, "end": 143.016, "en": "News Report Three.", "zh": "新闻报道三。", "role": "meta", "tip": "新闻三（电费冲击小企业）Q5–Q7：按行序出题，一二句给调查结论（近七成账单翻倍），三句给诉求（推迟调价＋延续信贷），五句面包店洗衣店的担忧即 Q7；by contrast 之后‘大企业受影响更小’务必听清。"}, {"start": 143.816, "end": 155.048, "en": "Owners of small shops and workshops say they cannot absorb another rise in electricity costs, according to a survey published on Monday by a regional business federation.", "zh": "一家地区商业联合会周一发布的调查显示，小商店和小作坊的店主们表示，他们已无力再消化电费的又一轮上涨。", "role": "n", "marks": [{"p": 45, "l": 47, "t": "answer", "note": "Q5：导语点出主题（小企业扛不住再涨电费），具体数据在下句"}, {"p": 139, "l": 30, "t": "detail", "note": "Q6：题干 the federation 即指这个机构，第三句的诉求由它提出"}]}, {"start": 155.348, "end": 167.54, "en": "Nearly seven in ten of the thirteen hundred firms questioned reported bills more than double what they paid two years earlier, and a quarter said they had already reduced staff hours or shut one site.", "zh": "在接受调查的一千三百家企业中，近七成反映电费账单是两年前的两倍多，四分之一表示已经削减了员工工时或关闭了一处营业点。", "role": "n", "marks": [{"p": 0, "l": 125, "t": "answer", "note": "Q5→A：受访一千三百家中近七成账单为两年前的两倍以上＝选项 “a majority of small firms…double or worse”"}, {"p": 131, "l": 68, "t": "trap", "note": "与 Q5 错项 B “A quarter of the firms have closed for good”、Q7 错项 B “shut one of their sites” 同词 a quarter／shut one site，原文是减工时或关一处而非倒闭，勿秒选"}]}, {"start": 167.84, "end": 177.296, "en": "The federation is asking the national regulator to postpone a scheduled change in wholesale pricing until spring and to extend short-term credit.", "zh": "该联合会正请求国家监管机构把定好的批发电价调整推迟到春季，并延长短期信贷。", "role": "n", "marks": [{"p": 51, "l": 61, "t": "answer", "note": "Q6→B：推迟批发定价调整＝选项 “a delay to a pricing change”；错项 A “permanent cut in wholesale prices” 也同用 wholesale，听清是推迟而非降价"}, {"p": 120, "l": 24, "t": "answer", "note": "Q6→B 后半：延续短期信贷＝选项 “continued lending”"}]}, {"start": 177.596, "end": 186.14, "en": "Large manufacturers, by contrast, have protected themselves with longer contracts and expect smaller increases.", "zh": "相比之下，大型制造商靠长期合同保护自己，预计涨幅会小一些。", "role": "n", "marks": [{"p": 0, "l": 19, "t": "trap", "note": "与 Q5 错项 C “Large manufacturers are suffering most” 逐字同词，原文恰恰说他们受损更小，勿秒选"}, {"p": 21, "l": 11, "t": "signal", "note": "Q5：对比信号，其后‘有更长约、涨幅更小’正是判定 C 反向的关键"}]}, {"start": 186.44, "end": 195.896, "en": "Owners of bakeries and laundries told reporters they were weighing higher prices, which they fear could push shoppers toward supermarket chains.", "zh": "面包店和洗衣店店主告诉记者，他们正在考虑提价，但又担心这样会把顾客推向连锁超市。", "role": "n", "marks": [{"p": 48, "l": 95, "t": "answer", "note": "Q7→D：想转嫁涨价、又怕顾客流向连锁超市＝选项 “Passing on costs may send buyers to larger chains”，fear 对应题干 worried"}]}, {"start": 196.196, "end": 204.26, "en": "The regulator answered that it reviews tariffs twice a year and that support schemes for vulnerable customers are already open.", "zh": "监管机构回应说，他们每年审查两次电价，而且针对困难用户的帮扶计划已经在受理申请。", "role": "n", "marks": [{"p": 69, "l": 57, "t": "trap", "note": "与 Q7 错项 A “the support schemes will be closed”、Q6 错项 D “vulnerable customers” 同词，原文是已经开放，勿秒选"}]}, {"start": 204.56, "end": 212.06, "en": "", "zh": "⏳ 请作答（7 秒）", "role": "gap"}, {"start": 212.06, "end": 214.364, "en": "Conversation One.", "zh": "对话一。", "role": "meta", "tip": "对话一（选课咨询）Q8–Q11：开场两句锁定‘两门研讨课要定一门’，Q9 在 but 之后（作业占期末三成），Q10 在退课时限那句及其后一句，Q11 在结尾两句（研究生辅导＋高峰排队）；答案几乎都在 W 的回应里。"}, {"start": 215.164, "end": 219.1, "en": "Excuse me, are you the first-year advisor?", "zh": "打扰一下，请问您是一年级新生辅导员吗？", "role": "m"}, {"start": 219.45, "end": 226.89, "en": "I have to lock in my Friday schedule by Thursday noon, and I'm stuck between two choices for the seminar requirement.", "zh": "我必须在周四中午之前敲定周五的课表安排，可研讨课的必修要求让我在两个选项之间卡住了。", "role": "m", "marks": [{"p": 10, "l": 43, "t": "trap", "note": "与 Q8 错项 A “ask for more time over the deadline” 同涉截止时间，她只是陈述期限并未求延期，勿秒选"}, {"p": 59, "l": 57, "t": "answer", "note": "Q8→C：开场两句即来意——两门研讨课之间定一门＝选项 “To settle which of two seminars to take this term”"}]}, {"start": 227.24, "end": 230.504, "en": "I am, Mia; sit down.", "zh": "我就是，米娅（Mia），坐下说吧。", "role": "w"}, {"start": 230.854, "end": 232.798, "en": "Which two?", "zh": "哪两门？", "role": "w"}, {"start": 233.148, "end": 237.66, "en": "Academic Writing, and Statistics for the Life Sciences.", "zh": "学术写作，还有生命科学统计学。", "role": "m"}, {"start": 238.01, "end": 246.026, "en": "My roommate took statistics last year; he says the lectures are easy to follow, but the problem sets eat four hours every week.", "zh": "我室友去年修了统计课；他说讲课很好懂，但每周的作业题要花掉四个小时。", "role": "m", "marks": [{"p": 80, "l": 3, "t": "signal", "note": "Q9：but 之后（每周吃掉四小时的 problem sets）才是出题段，前半 lectures easy to follow 是干扰"}]}, {"start": 246.376, "end": 253.816, "en": "That part is fair, and the sets are worth thirty percent of your final mark, so missing one is expensive.", "zh": "他说得没错，那些作业占期末成绩的百分之三十，少交一次损失很大。", "role": "w", "marks": [{"p": 23, "l": 52, "t": "answer", "note": "Q9→B：平时习题集占期末三成＝选项 “Regular homework decides part of the final mark”；Q11 错项 B “counts toward the course grade” 同涉成绩，但那是统计课作业、不是课外辅导"}]}, {"start": 254.166, "end": 257.646, "en": "What are you planning to do after you graduate?", "zh": "你毕业后打算做什么？", "role": "w"}, {"start": 257.996, "end": 263.012, "en": "Medical school, ideally, though I hate the thought of writing all year.", "zh": "理想情况下是上医学院，可一想到要整年写个不停我就头疼。", "role": "m"}, {"start": 263.362, "end": 266.266, "en": "Then writing isn't optional.", "zh": "那写作就不是可有可无的了。", "role": "w"}, {"start": 266.616, "end": 276.84, "en": "The entrance examination asks for an essay, and the programs we send students to want evidence that somebody can build an argument over ten pages.", "zh": "入学考试要写作文，我们送学生去的那些项目也想要有证据表明学生能写出一份贯穿十页纸的论证。", "role": "w"}, {"start": 277.19, "end": 283.022, "en": "But my laboratory course meets Tuesday evenings, so the writing section may not fit.", "zh": "但我的实验课在周二晚上上，所以写作课的那个班可能排不开。", "role": "m", "marks": [{"p": 4, "l": 43, "t": "trap", "note": "与 Q9 错项 A “lectures are held on Tuesday evenings”、C “before a laboratory course” 同词 Tuesday evenings／laboratory course，那是她的实验课而非统计课，勿秒选"}]}, {"start": 283.372, "end": 292.156, "en": "The sections run Tuesday evenings and Friday afternoons; the Tuesday one collides with your lab, so you'd want Friday.", "zh": "写作班分别排在周二晚上和周五下午；周二的班跟你的实验课冲突，所以你应该选周五那个。", "role": "w"}, {"start": 292.506, "end": 299.538, "en": "Two places were still open when the system refreshed this morning, and I wouldn't assume they'll last the day.", "zh": "今早系统刷新的时候还剩两个名额，我劝你别指望它们能留到今天结束。", "role": "w", "marks": [{"p": 0, "l": 26, "t": "trap", "note": "与 Q8 错项 D “a class that is already full” 同处选课名额语境，原文说还开着两个名额，与 D 相反，勿秒选"}]}, {"start": 299.888, "end": 303.248, "en": "What if I start it and find it too heavy?", "zh": "要是我选了之后觉得课业太重怎么办？", "role": "m"}, {"start": 303.598, "end": 305.686, "en": "Can I get out?", "zh": "能退课吗？", "role": "m"}, {"start": 306.036, "end": 311.46, "en": "You can withdraw without anything on your record until the Friday of week four.", "zh": "到第四周的周五为止，你退课不会在成绩单上留下任何记录。", "role": "w", "marks": [{"p": 17, "l": 31, "t": "trap", "note": "与 Q10 错项 B “leaves no mark on the record whenever it is done” 同词 record，B 抽掉了时限即错，勿秒选"}, {"p": 49, "l": 29, "t": "trap", "note": "与 Q10 错项 C “impossible before the fourth week” 同词 fourth／week，原文恰恰是此前可无记录退课，方向相反，勿秒选"}]}, {"start": 311.81, "end": 321.386, "en": "After that you need signatures from both instructors, and students who wait too long usually finish the term with a grade they didn't plan for.", "zh": "那之后就需要两位任课老师都签字，而且拖得太久的学生，往往到期末会拿到一个自己根本没打算要的成绩。", "role": "w", "marks": [{"p": 0, "l": 10, "t": "signal", "note": "Q10：时限转折，其后‘需两位任课教师签字’说明越晚越麻烦"}, {"p": 58, "l": 84, "t": "answer", "note": "Q10→A：拖太久会拿非计划的成绩＝选项 “It becomes harder to do the later it is left”"}]}, {"start": 321.736, "end": 323.488, "en": "Got it.", "zh": "明白了。", "role": "m"}, {"start": 323.838, "end": 327.126, "en": "Is there any support outside class?", "zh": "课外有什么辅导支持吗？", "role": "m"}, {"start": 327.476, "end": 335.3, "en": "The writing center takes two appointments a week online, and the tutors are graduate students in the same program.", "zh": "写作中心每周可以在线预约两次辅导，辅导老师是同专业的研究生。", "role": "w", "marks": [{"p": 19, "l": 29, "t": "trap", "note": "与 Q10 错项 D “requires an appointment at the writing center” 同词 appointment／writing center，原文是自愿线上预约而非要求，勿秒选"}, {"p": 61, "l": 52, "t": "answer", "note": "Q11→D：辅导者是同专业研究生＝选项 “Graduate students give it”"}]}, {"start": 335.65, "end": 341.41, "en": "In heavy weeks they run a queue instead, so you might sit for twenty minutes.", "zh": "作业多的那几周他们会改成现场排号，所以你可能会等上二十分钟。", "role": "w", "marks": [{"p": 15, "l": 24, "t": "answer", "note": "Q11→D 后半：高峰周改为排队＝选项 “though waiting may be involved”"}, {"p": 62, "l": 14, "t": "detail", "note": "Q11：等候时长数字，佐证 D 中的 waiting"}]}, {"start": 341.76, "end": 346.656, "en": "Then I'll take Friday writing and leave the statistics reading for later.", "zh": "那我就选周五的写作班，统计的阅读任务以后再说。", "role": "m", "marks": [{"p": 0, "l": 72, "t": "answer", "note": "Q8 佐证：两门之间最终选定周五写作班，印证来意是 settle which of two seminars"}]}, {"start": 347.006, "end": 348.782, "en": "Thank you.", "zh": "谢谢你。", "role": "m"}, {"start": 349.132, "end": 358.632, "en": "", "zh": "⏳ 请作答（9 秒）", "role": "gap"}, {"start": 358.632, "end": 361.056, "en": "Conversation Two.", "zh": "对话二。", "role": "meta", "tip": "对话二（面试兼职）Q12–Q15：第一轮听她的 farmstand 经历，Q13 抓男声 ‘What I really need to sort out is the clock’，Q14 在他最终报价那句（固定周六八小时、六周后再联系），Q15 在结尾 ‘Two things’ 之后一句。"}, {"start": 361.856, "end": 368.576, "en": "Good afternoon, you must be Elena; thanks for coming about the weekend position at the campus bookstore.", "zh": "下午好，你一定是埃琳娜（Elena）吧；欢迎你来面谈校园书店周末兼职的事。", "role": "m"}, {"start": 368.926, "end": 370.966, "en": "Have a seat.", "zh": "请坐。", "role": "m"}, {"start": 371.316, "end": 377.7, "en": "I've read your form, and my first question is a simple one: have you ever worked behind a counter?", "zh": "我看过你的申请表了，第一个问题很简单：你在柜台后面打过工吗？", "role": "m"}, {"start": 378.05, "end": 379.874, "en": "Thank you.", "zh": "谢谢。", "role": "w"}, {"start": 380.224, "end": 389.056, "en": "Two summers at a farmstand out of town, mostly weighing produce and handling money, so your register system will be new to me.", "zh": "在郊外的农产品直销店打过两个暑假，主要是给农产品称重和收钱，所以你们的收银系统对我来说完全是新的。", "role": "w", "marks": [{"p": 0, "l": 82, "t": "answer", "note": "Q12→B：两夏天在户外农产品摊称重收钱＝选项 “worked at an outdoor produce stand”"}, {"p": 87, "l": 38, "t": "trap", "note": "与 Q12 错项 C “used the shop's register system” 同词 register system，原文恰恰说她是新手，勿秒选"}]}, {"start": 389.406, "end": 396.294, "en": "That's no trouble; we train people on it during the first two shifts, and a manager is always on the floor.", "zh": "那没问题；头两个班次我们会培训收银，而且店里随时都有经理值班。", "role": "m", "marks": [{"p": 19, "l": 49, "t": "trap", "note": "与 Q13 错项 A “can operate the cash register” 同话题：男声随即说会培训，故收银能力不是他要考量的，勿秒选"}]}, {"start": 396.644, "end": 400.028, "en": "What I really need to sort out is the clock.", "zh": "我真正需要落实的是时间问题。", "role": "m", "marks": [{"p": 0, "l": 43, "t": "answer", "note": "Q13→C：really 强调他要理清的是时间（the clock），即能否覆盖最忙时段＝选项 “whether the woman can cover the busiest hours”"}]}, {"start": 400.378, "end": 408.202, "en": "I can be here any Saturday, but Sunday mornings my family drives into the city, so I could start at one.", "zh": "我哪个周六都可以来，但周日早上家里人开车进城，所以我一点之后才行。", "role": "w", "marks": [{"p": 28, "l": 3, "t": "signal", "note": "Q13／Q14：but 之后是她唯一的时间冲突（周日早上进城的家庭安排），男声下面正是针对这一时段"}]}, {"start": 408.552, "end": 411.264, "en": "Let's be exact, then.", "zh": "那我们就说得准确些。", "role": "m"}, {"start": 411.614, "end": 420.086, "en": "We're short between eight and noon on Sunday, and that's the busiest stretch of the week: deliveries, and students who missed the earlier line.", "zh": "我们周日八点到中午缺人手，而那正是一周里最忙的时段：既要收货，又有没赶上先前那波、挤到这个时段的学生。", "role": "m", "marks": [{"p": 12, "l": 32, "t": "detail", "note": "Q13→C：缺人时段的具体钟点，是被考到的时间细节"}, {"p": 50, "l": 38, "t": "answer", "note": "Q13→C：一周最忙的时段＝选项 “the busiest hours”"}, {"p": 90, "l": 10, "t": "trap", "note": "与 Q12 错项 A “run a delivery service” 同词，此处只指到店货品，勿秒选"}]}, {"start": 420.436, "end": 426.7, "en": "In that case I could ask my brother to take the drive and cover Sunday mornings myself.", "zh": "那样的话，我可以让我弟弟替家里跑进城这趟，周日早上我自己来顶班。", "role": "w", "marks": [{"p": 13, "l": 73, "t": "trap", "note": "与 Q15 错项 C “Ask her brother to take the Sunday shift” 逐字同词，但这只是她的设想且下句即被否，勿秒选"}]}, {"start": 427.05, "end": 431.226, "en": "I'd rather not build a schedule around family favors.", "zh": "我不太想把排班建立在麻烦你家人的基础上。", "role": "m", "marks": [{"p": 0, "l": 14, "t": "signal", "note": "Q15：拒绝信号，否掉让哥哥代劳的方案，故 C 不是他要求她做的事"}]}, {"start": 431.576, "end": 440.048, "en": "Here's what I can do: eight hours on Saturday, fixed, and when the spring timetable is set in six weeks I'll ring you first about Sunday.", "zh": "我可以这样安排：周六固定八个小时，等六周后春季课表定了，关于周日的安排我会第一个打电话给你。", "role": "m", "marks": [{"p": 22, "l": 30, "t": "answer", "note": "Q14→A：先给一个固定的周六八小时班次＝选项 “One guaranteed shift now”"}, {"p": 58, "l": 78, "t": "answer", "note": "Q14→A 后半：六周后春季课表定了第一个联系她＝选项 “with another possibly following”；错项 C “unpaid trial period of six weeks” 同用 six weeks，原文并无试用期，勿误选；B 的 March 在两句之后"}]}, {"start": 440.398, "end": 442.606, "en": "That suits me.", "zh": "这样挺适合我的。", "role": "w"}, {"start": 442.956, "end": 447.372, "en": "The notice said eleven dollars an hour; is that right?", "zh": "通知上说每小时十一美元，没错吧？", "role": "w"}, {"start": 447.722, "end": 453.818, "en": "It is, and it becomes thirteen in March, when the university raises the student minimum.", "zh": "没错，到三月份会涨到十三美元，到时候学校会上调学生兼职的最低工资标准。", "role": "m", "marks": [{"p": 22, "l": 17, "t": "trap", "note": "与 Q14 错项 B “A weekend post starting in March” 同词 March，那是涨薪时点而非开工时间，勿秒选"}]}, {"start": 454.168, "end": 460.048, "en": "There's also a discount of fifteen percent, but only on a day you're actually scheduled.", "zh": "还有百分之十五的购物折扣，不过只在你当天确实有排班的时候才能用。", "role": "m"}, {"start": 460.398, "end": 462.342, "en": "Understood.", "zh": "明白了。", "role": "w"}, {"start": 462.692, "end": 465.788, "en": "Do you need anything else from me today?", "zh": "今天还需要我再提供什么吗？", "role": "w"}, {"start": 466.138, "end": 468.154, "en": "Two things.", "zh": "两样东西。", "role": "m", "marks": [{"p": 0, "l": 10, "t": "signal", "note": "Q15：列举信号，其后一句就是 D 项的两项要求，务必听全两点"}]}, {"start": 468.504, "end": 476.784, "en": "Proof that you're enrolled, by Friday, and the name of somebody who has worked beside you before, because I'll ask them a question or two.", "zh": "周五前给我一份在读证明，再提供一个和你共事过的人的姓名，因为我要向他们了解一两个问题。", "role": "m", "marks": [{"p": 0, "l": 37, "t": "answer", "note": "Q15→D 前半：周五前交在读证明＝选项 “a document about her studies”"}, {"p": 43, "l": 53, "t": "answer", "note": "Q15→D 后半：给出共事过的人的姓名＝选项 “name someone who can vouch for her”"}]}, {"start": 477.134, "end": 482.342, "en": "I'll send the paperwork tonight and give you the manager from the farmstand.", "zh": "我今晚上就把材料发过来，推荐人可以填农场直销店的经理。", "role": "w"}, {"start": 482.692, "end": 492.192, "en": "", "zh": "⏳ 请作答（9 秒）", "role": "gap"}, {"start": 492.192, "end": 494.256, "en": "Passage One.", "zh": "篇章一。", "role": "meta", "tip": "篇章一（墨尔本步行研究）Q16–Q18：主题句在前两句，Q16 是第三句的做法（两千人三年＋绘制周边路网），Q17 抓 not…but 之后的交叉口密度，Q18 在末句 Planners now argue。"}, {"start": 495.056, "end": 505.184, "en": "For thirty years the distance an average American drives each day has barely changed, while the share of trips taken on foot has fallen to about one in fifty.", "zh": "三十年来，普通美国人每天开车的里程数几乎没有变化，而步行出行的比例已经降到大约五十分之一。", "role": "n"}, {"start": 505.484, "end": 516.452, "en": "Researchers in Melbourne decided to test whether the built environment could push that number the other way, and their findings are now changing how several cities approve new housing.", "zh": "墨尔本的研究人员决定检验一下，建筑环境能否把这个数字往反方向推动，他们的发现正在改变好几个城市审批新建住宅的方式。", "role": "n", "marks": [{"p": 0, "l": 24, "t": "detail", "note": "Q16：题干地名，听到即准备，真正做法在下一句"}, {"p": 149, "l": 14, "t": "trap", "note": "与 Q16 错项 B “compared Melbourne with several other cities” 同词 several cities，原文是多个城市据此修改审批，并未做城市间比较，勿秒选"}]}, {"start": 516.752, "end": 527.456, "en": "The study followed more than two thousand adults for three years, mapping every street within a kilometer of their homes and asking them to record where they actually went on foot.", "zh": "这项研究跟踪了两千多名成年人长达三年，绘制了他们家方圆一公里内的每一条街道，并请他们记录自己实际步行去过的地方。", "role": "n", "marks": [{"p": 19, "l": 45, "t": "detail", "note": "Q16→C：样本量与时长两个数字，是 tracked 的依据"}, {"p": 66, "l": 113, "t": "answer", "note": "Q16→C：绘制住所周边路网＋记录实际步行＝选项 “tracked what people walked and the streets around them”；错项 A “asked drivers to record their daily trips” 同用 record，但对象是步行者不是司机"}]}, {"start": 527.756, "end": 537.02, "en": "The strongest predictor turned out not to be parks or scenery but something drier: how many crossings a person needed to reach the next block.", "zh": "结果发现，最强的预测指标并不是公园或风景，而是个更干巴巴的因素：一个人走到下一个街区需要穿过多少处路口。", "role": "n", "marks": [{"p": 24, "l": 41, "t": "signal", "note": "Q17：not…but 是全段最关键的结构，parks 正是错项 D “nearest park” 的诱饵，真正的答案在 but 之后"}, {"p": 83, "l": 58, "t": "answer", "note": "Q17→A：最强预测因子＝到下个街区需要多少个路口，对应选项 “how frequent the crossings were”"}]}, {"start": 537.32, "end": 549.944, "en": "Districts built on long superblocks, where a shop sits two kilometers away behind a wall of garages, produced almost no walking at all, whatever residents said about their intentions.", "zh": "建在长条形超大街区上的社区——商店在两公里外、隔着一排车库墙——几乎产生不了任何步行，不管居民嘴上说多想走路都一样。", "role": "n"}, {"start": 550.244, "end": 561.116, "en": "Small blocks with frequent intersections kept people on their feet, and the effect held after the researchers allowed for income, age and whether a household owned a car.", "zh": "小街区、路口密集的设计能把人留在双脚上，而且在研究者把收入、年龄和家庭是否有车等因素考虑进去之后，这一效应依然成立。", "role": "n", "marks": [{"p": 0, "l": 66, "t": "answer", "note": "Q17→A 复述：小街区＋密集路口让人一直在走＝选项 “how short the blocks and how frequent the crossings”"}, {"p": 122, "l": 47, "t": "trap", "note": "与 Q17 错项 B “income”、C “whether the family owned a car” 逐字同词，原文是已被控制掉的变量，勿秒选"}]}, {"start": 561.416, "end": 573.08, "en": "A second result was less obvious: steps gathered in a few repeatable spots, so benches, shade and safe crossings brought outsize benefits where they were placed.", "zh": "第二个结果就不那么显而易见了：步行活动会汇聚到少数几个可以重复出现的地点，所以长椅、遮阴处和安全路口设在哪里，就在哪里带来超乎预期的效果。", "role": "n"}, {"start": 573.38, "end": 582.212, "en": "Planners now argue that laying pavement beside existing wide roads achieves far less than cutting those roads into shorter pieces.", "zh": "规划师们现在认为，在现有的宽阔马路旁边铺人行道，收效远远不如把这些马路切割成更短的路段。", "role": "n", "marks": [{"p": 24, "l": 105, "t": "answer", "note": "Q18→B：在宽路旁铺路面远不如把宽路切成短段＝选项 “Redesigning broad streets beats lining them with paths”；末句即答案，同时排除 A “widened sidewalks”"}]}, {"start": 582.512, "end": 590.012, "en": "", "zh": "⏳ 请作答（7 秒）", "role": "gap"}, {"start": 590.012, "end": 592.124, "en": "Passage Two.", "zh": "篇章二。", "role": "meta", "tip": "篇章二（睡眠与记忆）Q19–Q21：首句是学生的错误做法，次句 the opposite 起才是正文；Q19 在 consolidation 那句，Q20 在实验两句（12 小时、约一成），Q21 在 rest appears to choose 之后。"}, {"start": 592.924, "end": 599.908, "en": "Ask a student how to prepare for an examination and most will answer with late nights and strong coffee.", "zh": "问学生该怎么备考，大多数人的回答是熬夜加浓咖啡。", "role": "n"}, {"start": 600.208, "end": 604.84, "en": "Ask a neuroscientist and you are likely to hear the opposite.", "zh": "去问神经科学家，你听到的多半是相反的说法。", "role": "n", "marks": [{"p": 48, "l": 12, "t": "signal", "note": "Q19：与首句学生的熬夜＋咖啡做法相反，其后才是正文（睡眠的作用）"}]}, {"start": 605.14, "end": 619.492, "en": "During deep sleep the brain runs through the day's events at high speed, a process researchers call consolidation, and in doing so it carries fragile new information out of a temporary holding area and into permanent storage.", "zh": "在深度睡眠期间，大脑会以极高的速度重演白天经历的事情，研究者称之为巩固（consolidation）；在这个过程中，大脑把脆弱的新信息从临时存放区转移进永久存储区。", "role": "n", "marks": [{"p": 134, "l": 90, "t": "answer", "note": "Q19→D：深睡把脆弱的新信息从临时区搬进永久存储＝选项 “Fresh learning is moved into lasting storage”"}]}, {"start": 619.792, "end": 627.544, "en": "In one well-known experiment, volunteers learned a sequence of finger taps and were tested twelve hours later.", "zh": "在一个著名的实验中，志愿者们学习了一串手指敲击动作，十二小时后接受测试。", "role": "n", "marks": [{"p": 49, "l": 25, "t": "detail", "note": "Q20：题干实验内容，听到 finger taps 即锁定实验段"}, {"p": 79, "l": 30, "t": "trap", "note": "与 Q20 错项 D “Testing after twelve hours proved unreliable” 同词 twelve hours，测试时点本身没问题，勿秒选"}]}, {"start": 627.844, "end": 632.404, "en": "Half of them slept during that interval and half stayed awake.", "zh": "其中一半人在间隔期间睡了觉，另一半则一直保持清醒。", "role": "n", "marks": [{"p": 44, "l": 17, "t": "trap", "note": "与 Q20 错项 B “The group that stayed awake improved just as much” 同词 stayed awake，原文是他们几乎无进步，勿秒选"}]}, {"start": 632.704, "end": 643.72, "en": "The rested group improved by roughly ten percent on average, and the gains were still there a week later, while repetition with no sleep in between produced almost nothing.", "zh": "休息过的那组平均提高了大约百分之十，而且一周之后进步仍然保留；相比之下，中间不睡觉、只是一遍遍重复练习则几乎没有效果。", "role": "n", "marks": [{"p": 0, "l": 59, "t": "answer", "note": "Q20→A：休息组平均进步约一成且一周后仍在＝real gains"}, {"p": 106, "l": 65, "t": "answer", "note": "Q20→A 反证：不睡觉的重复练习几乎无收获（while 对比，B 项 “just as much” 与此相反）"}]}, {"start": 644.02, "end": 649.084, "en": "A second finding is stranger, because rest appears to choose.", "zh": "第二个发现更奇怪，因为睡眠似乎会挑挑拣拣。", "role": "n", "marks": [{"p": 30, "l": 30, "t": "signal", "note": "Q21：because 引出第二发现——睡眠会挑选，正是 C 项 tip the balance 的落点"}]}, {"start": 649.384, "end": 665.68, "en": "Not everything learned between breakfast and bedtime survives; cues presented around a study session, such as a particular smell or a brief tone, can tip which traces are kept, and anything tagged as emotionally important is pushed to the front of the queue.", "zh": "从早餐到睡前学到的东西并非都能保留下来；学习时段前后出现的线索，比如某种特定的气味或短暂的声音，能左右哪些记忆痕迹被保留，而任何被标记为情感重要的内容都会被推到队伍最前面。", "role": "n", "marks": [{"p": 0, "l": 61, "t": "trap", "note": "与 Q21 错项 A “Everything learned in a day is preserved” 同词 everything learned，原文是否定式，勿秒选"}, {"p": 63, "l": 112, "t": "answer", "note": "Q21→C：学习前后的线索（气味／短音）可左右哪些痕迹保留＝选项 “Cues given around learning can tip the balance”；别读成 D 的‘削弱记忆’"}, {"p": 181, "l": 76, "t": "trap", "note": "与 Q21 错项 B “Only emotional material is ever kept” 同词 emotional，原文是排到队首而非只保留这一类，勿秒选"}]}, {"start": 665.98, "end": 673.948, "en": "That helps explain why a student who works four hours and then sleeps often does better than one who works eight and does not.", "zh": "这有助于解释为什么学四个小时就去睡的学生，往往比连学八个小时不睡的学生表现更好。", "role": "n"}, {"start": 674.248, "end": 684.04, "en": "It also explains a cruelty in the same mechanism: an all-nighter damages recall of precisely the material the extra hours were meant to protect.", "zh": "这也解释了同一机制中残酷的一面：开夜车所损害的回忆，恰恰是多熬那几个小时本想保住的内容。", "role": "n"}, {"start": 684.34, "end": 691.84, "en": "", "zh": "⏳ 请作答（7 秒）", "role": "gap"}, {"start": 691.84, "end": 693.976, "en": "Passage Three.", "zh": "篇章三。", "role": "meta", "tip": "篇章三（动物导航）Q22–Q25：三种动物按顺序出题——蝴蝶（路线 preloaded／阴天读偏振光）、信鸽（堵住一通道改用其余）、沙漠蚁（数步幅）；每题答案都在该动物段落的第二句。"}, {"start": 694.776, "end": 702.672, "en": "How does a monarch butterfly, which has never made the journey, find a mountain valley it visited only in its ancestry?", "zh": "一只从未走过这段旅程的帝王蝶，是怎么找到它的祖先才到过的山间谷地的？", "role": "n"}, {"start": 702.972, "end": 708.108, "en": "The answer, increasingly, is that the route arrives preloaded.", "zh": "越来越多的证据给出的答案是：这条路线先天就预装好了。", "role": "n", "marks": [{"p": 34, "l": 27, "t": "answer", "note": "Q22→B：路线与生俱来＝选项 “The map seems to come with the travelers”（首句提问，本句作答）"}]}, {"start": 708.408, "end": 720.696, "en": "Monarchs crossing North America live in a chain of generations: the individuals that travel thousands of kilometers are great-great-grandchildren of those that left the same valleys the previous autumn.", "zh": "穿越北美的帝王蝶生活在一代接一代的链条上：跋涉数千公里的那些个体，是前一年秋天离开同一片山谷的那些蝴蝶的曾曾孙辈。", "role": "n", "marks": [{"p": 120, "l": 81, "t": "answer", "note": "Q22→B 依据：飞完全程的是去年离谷者的曾曾孙，没有成虫带路，故 A “learns from its parents”、D “跟随他虫” 均无据"}]}, {"start": 720.996, "end": 734.508, "en": "Field experiments with raised nets and displaced adults show that the insects combine a sun compass, which needs clear light, with an internal clock, so that they can correct for the sun's travel across the sky.", "zh": "用架高的网和易地放飞的成蝶所做的野外实验表明，这些昆虫会把需要晴天光线的太阳罗盘和体内生物钟结合起来，从而能针对太阳在天空中的移动做出修正。", "role": "n", "marks": [{"p": 101, "l": 23, "t": "trap", "note": "与 Q23 错项 A “land and wait for clear light” 同词 clear light，原文只说太阳罗盘需要晴光，未说降落等待，勿秒选"}]}, {"start": 734.808, "end": 744.984, "en": "Cloudy days do not stop them, because they also read polarization, a pattern in the light that survives cloud and that human eyes cannot detect.", "zh": "阴天也拦不住它们，因为它们还能识别偏振光——这种光的模式能够穿透云层，而人眼察觉不到。", "role": "n", "marks": [{"p": 30, "l": 7, "t": "signal", "note": "Q23：because 之后是阴天照飞的原因，也就是答案所在"}, {"p": 38, "l": 105, "t": "answer", "note": "Q23→D：读取人眼不可见的偏振光图案＝选项 “sense a pattern of light that we cannot see”"}]}, {"start": 745.284, "end": 749.1, "en": "Pigeons turn out to be even less single-minded.", "zh": "事实证明，鸽子在导航上更是多管齐下。", "role": "n", "marks": [{"p": 23, "l": 23, "t": "signal", "note": "Q24：程度递进（不止一种手段），提示下文列出多种通道，答案就在下句"}]}, {"start": 749.4, "end": 761.52, "en": "They use the Earth's magnetic field, odors carried along familiar routes and possibly low-frequency sound, and when researchers blocked one channel the birds simply relied on the rest.", "zh": "它们会利用地磁场、沿熟悉路线传播的气味，可能还有低频声音；当研究者堵住其中一条通道时，鸽子就干脆依靠其余的渠道。", "role": "n", "marks": [{"p": 0, "l": 105, "t": "answer", "note": "Q24→A 依据（三通道并用）；本句也是 Q23 错项 B “Earth's magnetic field” 的出处——那是信鸽的手段，不是蝴蝶"}, {"p": 111, "l": 72, "t": "answer", "note": "Q24→A：堵住一个通道就改用其余＝选项 “They lean on other cues when one is cut off”"}]}, {"start": 761.82, "end": 768.9, "en": "The most surprising navigation belongs to the desert ant, which keeps a tally of its own strides.", "zh": "最令人惊讶的导航本领属于沙漠蚁，它会默默记下自己迈出的步数。", "role": "n", "marks": [{"p": 42, "l": 14, "t": "detail", "note": "Q25：题干实验对象，听到即进入最后一题"}, {"p": 64, "l": 32, "t": "answer", "note": "Q25→C：靠数自己的步幅计量＝选项 “judge distance by how far their stride reaches”"}]}, {"start": 769.2, "end": 782.016, "en": "Scientists glued hair-thin extensions to some animals' legs and shortened others by amputation; the foragers then overshot or fell short of their nests by exactly the amount the alteration predicted.", "zh": "科学家在一些蚂蚁的腿上粘了细如发丝的加长杆，又把另一些蚂蚁的腿截短；结果外出觅食的蚂蚁要么飞过巢穴、要么离巢穴还差一段，偏差量恰好与改造所预测的完全一致。", "role": "n", "marks": [{"p": 11, "l": 48, "t": "trap", "note": "与 Q25 错项 B “walk faster when their legs are lengthened” 同词 legs／加长，原文说超出目标而非走得快，勿秒选"}, {"p": 114, "l": 84, "t": "answer", "note": "Q25→C：偏差恰等于腿长改变量，证明它按步幅测距"}]}, {"start": 782.316, "end": 787.332, "en": "No one has found an insect that uses only one sense to get home.", "zh": "人们至今还没有发现哪种昆虫只靠一种感官就能找到回家的路。", "role": "n"}, {"start": 787.632, "end": 797.132, "en": "", "zh": "⏳ 请作答（9 秒）", "role": "gap"}];
const a=document.getElementById('a'),wrap=document.getElementById('wrap');
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
document.getElementById('title').textContent=decodeURIComponent(location.pathname.split('/').slice(-2,-1)[0])+' — Listening';
function enFrag(c){
 const f=document.createDocumentFragment();let pos=0;
 (c.marks||[]).forEach(m=>{
  if(m.p>pos)f.append(document.createTextNode(c.en.slice(pos,m.p)));
  const k=document.createElement('mark');k.className='k-'+m.t;
  k.textContent=c.en.substr(m.p,m.l);if(m.note)k.title=m.note;f.append(k);pos=m.p+m.l;});
 f.append(document.createTextNode(c.en.slice(pos)));return f;}
CUES.forEach((c)=>{const p=document.createElement('p');
 if(c.role==='gap'){p.className='line gap';p.textContent=c.zh||'…';}
 else{p.className='line r-'+c.role+' '+c.role;
  if(c.zh){const z=document.createElement('span');z.className='zh';z.textContent=c.zh;p.append(z);}
  const e=document.createElement('span');e.className='en';e.append(enFrag(c));p.append(e);}
 p.onclick=()=>{a.currentTime=c.start+.02;};wrap.appendChild(p);c.el=p;
 if(c.tip){const t=document.createElement('div');t.className='tip-line';t.textContent='🎧 '+c.tip;wrap.appendChild(t);c.tipEl=t;}});
let cur=-1;
function paint(i){
 const en=document.getElementById('en'),zh=document.getElementById('zh'),tip=document.getElementById('tip');
 en.textContent='';zh.textContent='';tip.textContent='';
 if(i<0)return;const c=CUES[i];
 if(c.role==='gap')zh.textContent=c.zh;
 else{en.append(enFrag(c));zh.textContent=c.zh||'';if(c.tip)tip.textContent='🎧 '+c.tip;}}
a.addEventListener('timeupdate',()=>{const t=a.currentTime;
 let i=CUES.findIndex(c=>t>=c.start&&t<c.end);
 if(i!==cur){if(cur>=0)CUES[cur].el.classList.remove('on');
  if(i>=0){CUES[i].el.classList.add('on');CUES[i].el.scrollIntoView({block:'center',behavior:'smooth'});}
  paint(i);cur=i;}
 const d=a.duration||1;const r=Math.min(t/d,1);
 document.getElementById('fill').style.width=(r*100)+'%';
 document.getElementById('knob').style.left=(r*100)+'%';
 document.getElementById('time').textContent=fmt(t)+' / '+fmt(a.duration||0);});
const play=document.getElementById('play');
play.onclick=()=>{a.paused?a.play():a.pause();};
a.onplay=()=>play.textContent='⏸';a.onpause=()=>play.textContent='▶';
const bar=document.getElementById('bar');
function seekEv(e){const r=bar.getBoundingClientRect();
 a.currentTime=Math.min(Math.max((e.clientX-r.left)/r.width,0),1)*(a.duration||0);}
bar.addEventListener('pointerdown',e=>{bar.setPointerCapture(e.pointerId);seekEv(e);bar._d=true;});
bar.addEventListener('pointermove',e=>{if(bar._d)seekEv(e);});
bar.addEventListener('pointerup',()=>bar._d=false);
